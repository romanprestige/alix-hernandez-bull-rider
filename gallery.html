
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Gallery | Alix Hernandez Bull Rider</title>
<style>
:root {
  --gold: #d8ad58;
  --dark: #090c0e;
  --panel: #11181d;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--dark);
  color: #f5f0e8;
  font-family: Arial, sans-serif;
}
header {
  padding: 22px 18px;
  border-bottom: 1px solid #745a2d;
  text-align: center;
}
.brand {
  color: var(--gold);
  font-family: Georgia, serif;
  font-size: 26px;
  font-weight: bold;
  letter-spacing: 2px;
}
nav {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
  margin-top: 20px;
}
nav a {
  color: #f5f0e8;
  text-decoration: none;
  font-size: 14px;
}
nav a:hover { color: var(--gold); }
.hero {
  text-align: center;
  padding: 65px 20px 45px;
}
.eyebrow {
  color: var(--gold);
  letter-spacing: 5px;
  font-size: 12px;
  text-transform: uppercase;
}
h1 {
  font-family: Georgia, serif;
  font-size: clamp(42px, 9vw, 76px);
  margin: 22px 0;
}
.line {
  width: 85px;
  height: 4px;
  background: var(--gold);
  margin: 25px auto;
}
.intro {
  color: #bcbcbc;
  line-height: 1.7;
  max-width: 600px;
  margin: auto;
}
.gallery {
  max-width: 1150px;
  margin: auto;
  padding: 20px 18px 80px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}
figure {
  margin: 0;
  background: var(--panel);
  border: 1px solid #4b3b24;
  overflow: hidden;
}
figure img {
  display: block;
  width: 100%;
  height: 270px;
  object-fit: cover;
  cursor: pointer;
}
figcaption {
  padding: 16px;
  text-align: center;
  color: var(--gold);
  font-size: 14px;
}
footer {
  padding: 35px 15px;
  border-top: 1px solid #745a2d;
  color: #aaa;
  text-align: center;
}
footer a { color: var(--gold); }
.viewer {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(0,0,0,.95);
  align-items: center;
  justify-content: center;
  padding: 50px 15px;
}
.viewer.open { display: flex; }
.viewer img {
  max-width: 100%;
  max-height: 85vh;
  object-fit: contain;
}
.close {
  position: absolute;
  top: 15px;
  right: 20px;
  color: white;
  background: none;
  border: 0;
  font-size: 38px;
  cursor: pointer;
}
@media(max-width: 800px) {
  .gallery { grid-template-columns: repeat(2,1fr); }
}
@media(max-width: 520px) {
  .gallery { grid-template-columns: 1fr; }
  figure img { height: auto; max-height: 460px; }
}
</style>
</head>
<body>
<header>
  <div class="brand">ALIX HERNANDEZ</div>
  <nav>
    <a href="index.html">HOME</a>
    <a href="sponsorship.html">SPONSORSHIP</a>
    <a href="gallery.html" aria-current="page">GALLERY</a>
    <a href="index.html#contact">CONTACT</a>
  </nav>
</header>

<main>
  <section class="hero">
    <div class="eyebrow">The Ride • The Grind • The Journey</div>
    <h1>PHOTO GALLERY</h1>
    <div class="line"></div>
    <p class="intro">
      Every ride tells a story. Follow Alix Hernandez
      through competition, training, ranch life,
      and the road toward professional bull riding.
    </p>
  </section>

  <section class="gallery" aria-label="Alix Hernandez photos">
    <figure>
      <img src="FB_IMG_1792766875515.jpg"
           alt="Alix Hernandez with his dog"
           loading="lazy">
      <figcaption>Beyond the Arena</figcaption>
    </figure>

    <!-- Replace filenames below as new photos are uploaded -->
    <figure>
      <img src="ride-01.jpg" alt="Bull riding action" loading="lazy">
      <figcaption>Eight Seconds</figcaption>
    </figure>
    <figure>
      <img src="ride-02.jpg" alt="Rodeo competition" loading="lazy">
      <figcaption>Competition Day</figcaption>
    </figure>
    <figure>
      <img src="IMG_2819.jpg" alt="Training for bull riding" loading="lazy">
      <figcaption>The Grind</figcaption>
    </figure>
    <figure>
      <img src="ride-04.jpg" alt="Alix at the rodeo" loading="lazy">
      <figcaption>Rodeo Life</figcaption>
    </figure>
    <figure>
      <img src="ride-05.jpg" alt="Alix Hernandez journey" loading="lazy">
      <figcaption>The Journey Continues</figcaption>
    </figure>
    
<figure>
  <img src="IMG_9494.jpg"
       alt="Alix Hernandez Bull Riding"
       loading="lazy">
  <figcaption>Alix Hernandez - Bull Riding</figcaption>
</figure>
  
  </section>
</main>

<footer>
  BUILT DIFFERENT. RIDE FURTHER.
  <p><a href="index.html">Return to Homepage</a></p>
</footer>

<div class="viewer" id="viewer" role="dialog"
     aria-label="Photo viewer" aria-modal="true">
  <button class="close" id="close" aria-label="Close photo">×</button>
  <img id="largePhoto" alt="">
</div>

<script>
const viewer = document.getElementById('viewer');
const largePhoto = document.getElementById('largePhoto');

document.querySelectorAll('.gallery img').forEach(img => {
  img.addEventListener('click', () => {
    if (!img.complete || !img.naturalWidth) return;
    largePhoto.src = img.src;
    largePhoto.alt = img.alt;
    viewer.classList.add('open');
  });
});
function closeViewer() {
  viewer.classList.remove('open');
  largePhoto.removeAttribute('src');
}
document.getElementById('close').onclick = closeViewer;
viewer.addEventListener('click', e => {
  if (e.target === viewer) closeViewer();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeViewer();
});
</script>
</body>
</html>
